name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - LICENSE
      - .vscode/**
      - .claude/**
      - _/**
  pull_request:
    paths-ignore:
      - '*.md'
      - LICENSE
      - .vscode/**
      - .claude/**
      - _/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check, format:check, build]
    name: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - run: pnpm ${{ matrix.task }}
